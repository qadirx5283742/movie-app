[build]
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/movies"
  to = "/.netlify/functions/movies"
  status = 200
  force = true

[[redirects]]
  from = "/api/movies/:id"
  to = "/.netlify/functions/movie?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/trending"
  to = "/.netlify/functions/trending"
  status = 200
  force = true

[[redirects]]
  from = "/api/search-metrics"
  to = "/.netlify/functions/search-metrics"
  status = 200
  force = true